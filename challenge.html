<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Just a moment...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            line-height: 1.15;
            -webkit-text-size-adjust: 100%;
            color: #f2f2f2;
            background-color: #000;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: #000;
        }

        .main-wrapper {
            flex: 1;
        }

        .main-content {
            margin: 8rem auto;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
            max-width: 60rem;
        }

        @media (max-width: 720px) {
            .main-content {
                margin-top: 4rem;
            }
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .favicon {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .favicon svg {
            width: 18px;
            height: 18px;
            fill: #fff;
        }

        .host-name {
            font-size: 1.25rem;
            font-weight: 500;
            color: #f2f2f2;
        }

        .challenge-header {
            font-size: 1.5rem;
            font-weight: 500;
            line-height: 1.3;
            margin-bottom: 0.5rem;
            color: #f2f2f2;
        }

        .challenge-body {
            font-size: 1rem;
            line-height: 1.5;
            color: #a3a3a3;
            margin-bottom: 1.5rem;
        }

        .cf-turnstile-wrapper {
            width: 300px;
            height: 65px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: border-color 0.15s ease;
        }

        .cf-turnstile-wrapper:hover {
            border-color: #444;
        }

        .cf-turnstile-wrapper.verifying,
        .cf-turnstile-wrapper.verified {
            cursor: default;
            pointer-events: none;
        }

        .turnstile-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .turnstile-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .turnstile-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #666;
            border-radius: 4px;
            background: transparent;
            position: relative;
        }

        .turnstile-spinner {
            width: 24px;
            height: 24px;
            display: none;
            position: relative;
        }

        .turnstile-spinner svg {
            width: 100%;
            height: 100%;
            animation: spin 0.75s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .turnstile-success {
            width: 24px;
            height: 24px;
            display: none;
            position: relative;
        }

        .turnstile-success svg {
            width: 100%;
            height: 100%;
        }

        .turnstile-label {
            font-size: 0.875rem;
            color: #d4d4d4;
        }

        .turnstile-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }

        .cf-logo {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .cf-logo-icon svg {
            width: 28px;
            height: 28px;
        }

        .cf-logo-text {
            font-size: 0.6875rem;
            font-weight: 500;
            color: #888;
            letter-spacing: 0.5px;
        }

        .privacy-links {
            display: flex;
            gap: 8px;
        }

        .privacy-links a {
            font-size: 0.625rem;
            color: #666;
            text-decoration: none;
        }

        .privacy-links a:hover {
            text-decoration: underline;
        }

        .cf-turnstile-wrapper.verifying .turnstile-checkbox { display: none; }
        .cf-turnstile-wrapper.verifying .turnstile-spinner { display: block; }

        .cf-turnstile-wrapper.verified .turnstile-checkbox { display: none; }
        .cf-turnstile-wrapper.verified .turnstile-spinner { display: none; }
        .cf-turnstile-wrapper.verified .turnstile-success { display: block; }
        .cf-turnstile-wrapper.verified .turnstile-label { color: #22c55e; }
        .cf-turnstile-wrapper.verified { border-color: #22c55e40; }

        .spacer {
            flex: 1;
        }

        .footer {
            padding: 1rem 1.5rem;
            text-align: center;
        }

        .footer-inner {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: #666;
        }

        .footer-inner a {
            color: #888;
            text-decoration: none;
        }

        .footer-inner a:hover {
            text-decoration: underline;
        }

        .ray-id {
            color: #666;
        }

        .clearfix-footer::after {
            content: "";
            display: table;
            clear: both;
        }

        @media (max-width: 400px) {
            .cf-turnstile-wrapper {
                width: 100%;
                max-width: 300px;
            }
            .challenge-header {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="main-content">
            <div class="section-header">
                <div class="favicon">
                    <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                </div>
                <span class="host-name">x.com</span>
            </div>

            <h1 class="challenge-header">Verifying you are human. This may take a few seconds.</h1>
            <p class="challenge-body">x.com needs to review the security of your connection before proceeding.</p>

            <div class="cf-turnstile-wrapper" id="turnstile" onclick="verify()">
                <div class="turnstile-inner">
                    <div class="turnstile-left">
                        <div class="turnstile-checkbox"></div>
                        <div class="turnstile-spinner">
                            <svg viewBox="0 0 24 24" fill="none">
                                <circle cx="12" cy="12" r="10" stroke="#333" stroke-width="3"/>
                                <path d="M12 2a10 10 0 0 1 10 10" stroke="#f6821f" stroke-width="3" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <div class="turnstile-success">
                            <svg viewBox="0 0 24 24" fill="none">
                                <circle cx="12" cy="12" r="11" fill="#22c55e"/>
                                <polyline points="7,12 10,15 17,8" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                            </svg>
                        </div>
                        <span class="turnstile-label" id="label">Verify you are human</span>
                    </div>
                    <div class="turnstile-right">
                        <div class="cf-logo">
                            <div class="cf-logo-icon">
                                <svg viewBox="0 0 61 23" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M50.3 7.5c-.2 0-.3.1-.4.2l-.3 1c-.1.3-.1.5 0 .7.1.3.3.5.6.6l4.6.6c.1 0 .2.1.3.2 0 .1 0 .2-.1.3-.1.1-.3.3-.5.3l-4.8.6c-.7.1-1.4.7-1.7 1.4l-.2.5c0 .1 0 .2.1.3s.2.1.3.1h7c.1 0 .2-.1.2-.2.1-.3.1-.6.1-.9 0-2.6-2.1-4.7-4.7-4.7h-.5z" fill="#FAAD3F"/>
                                    <path d="M41.5 12.6c-.1-.3-.3-.5-.6-.6l-8.2-1c-.1 0-.2-.1-.3-.2 0-.1 0-.2.1-.3.1-.2.3-.3.5-.3l8.4-1c.7-.1 1.4-.7 1.7-1.4l.6-1.6c0-.1.1-.2 0-.3 0-.1-.1-.2-.1-.2-.8-2.4-3-4.1-5.7-4.1-3.3 0-6 2.4-6.5 5.5-.5-.7-1.4-1.1-2.3-1.1-1.6 0-2.9 1.2-3.1 2.8v.7c-2.5.1-4.5 2.1-4.5 4.5 0 .2 0 .5.1.7 0 .2.1.3.3.3h18.9c.2 0 .3-.1.4-.2l.5-1.4c.2-.3.2-.6.1-.8z" fill="#F6821F"/>
                                </svg>
                            </div>
                        </div>
                        <div class="privacy-links">
                            <a href="javascript:void(0)">Privacy</a>
                            <a href="javascript:void(0)">Terms</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="spacer"></div>

    <footer class="footer clearfix-footer">
        <div class="footer-inner">
            <span class="ray-id">Ray ID: <code id="rayid"></code></span>
            <span>•</span>
            <span>Performance & security by</span>
            <a href="javascript:void(0)">Cloudflare</a>
        </div>
    </footer>

    <script>
        // Generate random ray ID
        document.getElementById('rayid').textContent = Array.from({length: 16}, () => 
            '0123456789abcdef'[Math.floor(Math.random() * 16)]).join('');

        let done = false;
        function verify() {
            if (done) return;
            done = true;
            const el = document.getElementById('turnstile');
            const label = document.getElementById('label');
            el.classList.add('verifying');
            label.textContent = 'Verifying...';
            setTimeout(() => {
                el.classList.remove('verifying');
                el.classList.add('verified');
                label.textContent = 'Success';
                // Set verified cookie and redirect to root (X landing page)
                setTimeout(() => {
                    document.cookie = "cf_clearance=1; path=/; max-age=86400";
                    window.location.href = '/?v=1';
                }, 800);
            }, 2000 + Math.random() * 1000);
        }
        // User must click - no auto-start
    </script>
</body>
</html>
